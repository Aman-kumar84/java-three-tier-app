version: '3.8'
services:
  
  frontend:
    build: 
      context: ./frontend
    container_name: java-frontend
    ports:
      - "80:80"
    depends_on:
      - backend


  backend:
    build: 
      context: ./backend
    container_name: java-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/java_three_tier
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy  

  mysql:
    image: mysql:8.0
    container_name: java-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: java_three_tier
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 5 
volumes:
  mysql_data:             
