<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Product Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<section class="card">
<p class="eyebrow">JAVA THREE-TIER APPLICATION</p>
<h1>Product Manager</h1>
<p class="subtitle">Java + Spring Boot + MySQL</p>

<form id="productForm">
<input id="name" type="text" placeholder="Product name" required>
<input id="price" type="number" min="0" step="0.01" placeholder="Price" required>
<button type="submit">Add Product</button>
</form>

<p id="message"></p>

<table>
<thead><tr><th>ID</th><th>Product</th><th>Price</th><th>Action</th></tr></thead>
<tbody id="products"></tbody>
</table>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
